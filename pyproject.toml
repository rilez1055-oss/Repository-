[project]
name = "openai-oci-agent-reference"
version = "0.1.0"
description = "Testable reference architecture for OCI workload identity, federation, agent execution, and server-side tool authorization"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
testpaths = ["identity-probe/tests", "federation/tests", "openai-client/tests", "mcp-server/tests", "workspace-agent/tests"]

[tool.ruff]
line-length = 100
