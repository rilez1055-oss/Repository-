[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-openai-reference-architecture"
version = "0.1.0"
description = "Gated OCI to OpenAI federation reference architecture"
requires-python = ">=3.11"
dependencies = [
  "oci>=2.0",
  "requests>=2.31",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
